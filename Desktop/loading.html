<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chargement d'EasyFacture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
            overflow: hidden;
        }
        .container {
            text-align: center;
            transition: opacity 0.8s ease-in-out;
        }
        .logo {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }
        .message {
            font-size: 14px;
            color: #94a3b8;
            height: 20px;
            margin-bottom: 30px;
        }
        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        /* Style pour l'effet de fondu final */
        .welcome-screen {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .welcome-screen.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- Remplace par assets/logo.ico ou ton image si besoin -->
        <img src="assets/logo.ico" alt="Logo EasyFacture" class="logo" onerror="this.style.display='none'">
        <h1>EasyFacture</h1>
        <div class="message" id="loading-msg">Préparation de votre espace de travail...</div>
        <div class="spinner" id="spinner"></div>
    </div>

    <script>
        const messages = [
            "Vérification des moteurs de calcul...",
            "Chargement de vos factures et clients...",
            "Optimisation de l'interface...",
            "Presque prêt..."
        ];

        let msgIndex = 0;
        const msgElement = document.getElementById("loading-msg");

        const msgInterval = setInterval(() => {
            msgIndex++;
            if (msgIndex < messages.length) {
                msgElement.textContent = messages[msgIndex];
            } else {
                clearInterval(msgInterval);
            }
        }, 800);

        // Fonction pour tester si le serveur NiceGUI est bien démarré
        function checkServer() {
            fetch("http://localhost:9876", { mode: 'no-cors' })
                .then(() => {
                    clearInterval(msgInterval);
                    msgElement.textContent = "Bienvenue ! 🎉";
                    document.getElementById("spinner").style.display = "none";
                    
                    document.getElementById("main-container").classList.add("welcome-screen");
                    document.getElementById("main-container").classList.add("show");

                    // Redirection dans le *même* onglet (remplace la page de chargement au lieu d'en ouvrir une autre)
                    setTimeout(() => {
                        window.location.replace("http://localhost:9876");
                    }, 500);
                })
                .catch(() => {
                    // Si le serveur n'est pas encore prêt, on retente dans 400ms
                    setTimeout(checkServer, 400);
                });
        }

        // Lancement du poll après un court délai initial
        setTimeout(checkServer, 1000);
    </script>
</body>
</html>
